run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - gofmt
    - gofumpt
    - revive
    - staticcheck
    - errcheck
    - ineffassign
    - gosimple
    - typecheck

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

linters-settings:
  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: error-return
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck      # 에러 체크
    - gosimple      # 간단한 코드 개선 제안
    - govet         # go vet
    - ineffassign   # 사용하지 않는 할당
    - staticcheck   # 정적 분석
    - unused        # 사용하지 않는 코드
    - gofmt         # 포맷팅
    - goimports     # import 정렬

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/curogom/curompt

issues:
  exclude-rules:
    # 테스트 파일은 일부 규칙 완화
    - path: _test\.go
      linters:
        - errcheck
        - gosimple
