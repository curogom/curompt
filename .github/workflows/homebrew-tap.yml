name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

permissions:
  contents: write  # Tap 레포지토리 업데이트에 필요

jobs:
  update-tap:
    name: Update Homebrew Tap Formula
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: curogom/homebrew-curompt
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap-repo
          fetch-depth: 0
          persist-credentials: false
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            # Release 이벤트인 경우
            VERSION=${GITHUB_REF#refs/tags/}
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # workflow_dispatch인 경우
            VERSION=${{ github.event.inputs.version }}
          else
            # 기본값 (release 워크플로우에서 트리거된 경우)
            VERSION=${{ github.event.inputs.version || github.event.client_payload.version || 'unknown' }}
          fi
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Download tarball and calculate SHA256
        id: sha256
        run: |
          TARBALL_URL="https://github.com/curogom/curompt/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz"
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"
      
      - name: Update Formula
        working-directory: tap-repo
        run: |
          FORMULA_FILE="Formula/c/curompt.rb"
          if [ ! -f "$FORMULA_FILE" ]; then
            FORMULA_FILE="Formula/curompt.rb"
          fi
          
          TARBALL_URL="https://github.com/curogom/curompt/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz"
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          
          # Update URL
          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" "$FORMULA_FILE"
          
          # Update SHA256
          sed -i "s/sha256 \".*\"/sha256 \"${{ steps.sha256.outputs.sha256 }}\"/" "$FORMULA_FILE"
          
          # Update version declaration
          sed -i "s/version \".*\"/version \"${VERSION_NUM}\"/" "$FORMULA_FILE"
          
          echo "✅ Formula updated:"
          cat "$FORMULA_FILE"
      
      - name: Commit and push
        working-directory: tap-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "Update curompt to ${{ steps.version.outputs.version }}" || exit 0
          git config --global --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/curogom/homebrew-curompt.git"
          git push origin main
