name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

jobs:
  update-tap:
    name: Update Homebrew Tap Formula
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: curogom/homebrew-curo-prompt
          token: ${{ secrets.GITHUB_TOKEN }}
          path: tap-repo
          fetch-depth: 0
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Download tarball and calculate SHA256
        id: sha256
        run: |
          TARBALL_URL="https://github.com/curogom/curo-prompt/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz"
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"
      
      - name: Update Formula
        working-directory: tap-repo
        run: |
          FORMULA_FILE="Formula/c/curo-prompt.rb"
          if [ ! -f "$FORMULA_FILE" ]; then
            FORMULA_FILE="Formula/curo-prompt.rb"
          fi
          
          TARBALL_URL="https://github.com/curogom/curo-prompt/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz"
          
          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" "$FORMULA_FILE"
          sed -i "s/sha256 \".*\"/sha256 \"${{ steps.sha256.outputs.sha256 }}\"/" "$FORMULA_FILE"
          
          echo "✅ Formula updated:"
          cat "$FORMULA_FILE"
      
      - name: Commit and push
        working-directory: tap-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "Update curo-prompt to ${{ steps.version.outputs.version }}" || exit 0
          git push origin main

