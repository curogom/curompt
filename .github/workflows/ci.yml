name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      - name: Install dependencies
        run: go mod download
      
      - name: Run tests
        run: go test ./... -v -coverprofile=coverage.out
      
      - name: Verify coverage file
        run: |
          if [ ! -f coverage.out ]; then
            echo "Warning: coverage.out not generated, creating empty file"
            touch coverage.out
          fi
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          file: ./coverage.out
          fail_ci_if_error: false
      
      - name: Show coverage
        run: |
          if [ -f coverage.out ] && [ -s coverage.out ]; then
            go tool cover -func=coverage.out | tail -1
          else
            echo "No coverage data available"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      - name: Build
        run: make build
      
      - name: Verify binary exists
        run: |
          if [ ! -f ./bin/curompt ]; then
            echo "Error: Binary not found at ./bin/curompt"
            ls -la bin/ || echo "bin/ directory does not exist"
            exit 1
          fi
          echo "Binary found:"
          ls -lh ./bin/curompt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curompt-${{ matrix.os }}
          path: ./bin/curompt
          if-no-files-found: error
