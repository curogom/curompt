name: Release

on:
  push:
    tags:
      - 'v*'

# GitHub Actions 권한 설정
permissions:
  contents: write  # Release 생성에 필요

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 필요 (태그용)
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      - name: Get version from tag
        id: tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
      
      - name: Create source tarball
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          git archive --format=tar.gz --prefix=curompt-${{ steps.tag.outputs.version_num }}/ \
            -o curompt-${{ steps.tag.outputs.version_num }}.tar.gz ${{ steps.tag.outputs.version }}
      
      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(shasum -a 256 curompt-${{ steps.tag.outputs.version_num }}.tar.gz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "✅ SHA256 for Homebrew: $SHA256"
          echo ""
          echo "Update Formula/curompt.rb with:"
          echo "  url \"https://github.com/curogom/curompt/archive/refs/tags/${{ steps.tag.outputs.version }}.tar.gz\""
          echo "  sha256 \"$SHA256\""
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            curompt-${{ steps.tag.outputs.version_num }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout Tap repository
        uses: actions/checkout@v4
        with:
          repository: curogom/homebrew-curompt
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Update Homebrew Tap Formula
        working-directory: tap-repo
        env:
          TARBALL_URL: https://github.com/curogom/curompt/archive/refs/tags/${{ steps.tag.outputs.version }}.tar.gz
          SHA256: ${{ steps.sha256.outputs.sha256 }}
          VERSION_NUM: ${{ steps.tag.outputs.version_num }}
        run: |
          FORMULA_FILE="Formula/c/curompt.rb"
          if [ ! -f "$FORMULA_FILE" ]; then
            FORMULA_FILE="Formula/curompt.rb"
          fi

          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" "$FORMULA_FILE"
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$FORMULA_FILE"
          sed -i "s/version \".*\"/version \"${VERSION_NUM}\"/" "$FORMULA_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_FILE"
          git commit -m "Update curompt to ${{ steps.tag.outputs.version }}" || exit 0
          # Ensure remote uses token
          git config --global --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/curogom/homebrew-curompt.git"
          git push origin main

  build:
    name: Build Binaries
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # Release asset 업로드에 필요
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset_name: curompt-linux-amd64
          - os: macos-latest
            asset_name: curompt-darwin-amd64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      - name: Build
        run: make build
      
      - name: Rename binary
        run: mv ./bin/curompt ./bin/${{ matrix.asset_name }}
      
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/${{ matrix.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
