name: Release

on:
  push:
    tags:
      - 'v*'

# GitHub Actions 권한 설정
permissions:
  contents: write  # Release 생성에 필요

jobs:
  build:
    permissions:
      contents: write
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 필요 (태그용)
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      
      - name: Get version from tag
        id: tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
      
      - name: Create source tarball
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          git archive --format=tar.gz --prefix=curo-prompt-${{ steps.tag.outputs.version_num }}/ \
            -o curo-prompt-${{ steps.tag.outputs.version_num }}.tar.gz ${{ steps.tag.outputs.version }}
      
      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(shasum -a 256 curo-prompt-${{ steps.tag.outputs.version_num }}.tar.gz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "✅ SHA256 for Homebrew: $SHA256"
          echo ""
          echo "Update Formula/curo-prompt.rb with:"
          echo "  url \"https://github.com/curogom/curo-prompt/archive/refs/tags/${{ steps.tag.outputs.version }}.tar.gz\""
          echo "  sha256 \"$SHA256\""
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            curo-prompt-${{ steps.tag.outputs.version_num }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Binaries
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset_name: curo-prompt-linux-amd64
          - os: macos-latest
            asset_name: curo-prompt-darwin-amd64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      
      - name: Build
        run: make build
      
      - name: Rename binary
        run: mv ./bin/curo-prompt ./bin/${{ matrix.asset_name }}
      
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/${{ matrix.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

